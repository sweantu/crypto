services:
  jobmanager:
    image: crypto-stream-flink
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./jupyter/workspace:/workspace
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1g
        rest.port: 8081
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints

  taskmanager:
    image: crypto-stream-flink
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - ./jupyter/workspace:/workspace
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
        parallelism.default: 1

  jupyter:
    image: crypto-stream-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/workspace:/workspace
    environment:
      - JUPYTER_TOKEN=123456
    depends_on:
      - jobmanager
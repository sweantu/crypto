services:
  jupyter:
    image: crypto-batch-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/data:/data # shared folder
      - ./spark/extra-jars:/opt/spark-extra-jars/
    working_dir: /data # <-- important!
    environment:
      - JUPYTER_TOKEN=123456

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  hive-metastore:
    image: crypto-batch-hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - HIVE_METASTORE_DRIVER=org.postgresql.Driver
      - HIVE_METASTORE_JDBC_URL=jdbc:postgresql://postgres:5432/metastore
      - HIVE_METASTORE_USER=hive
      - HIVE_METASTORE_PASSWORD=hive
      - HIVE_CUSTOM_CONF_DIR=/opt/hive/conf
    ports:
      - "9083:9083"
    depends_on:
      - postgres
      - minio
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./spark/extra-jars:/opt/spark-extra-jars/ # For Spark only

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    volumes:
      - postgres:/var/lib/postgresql/data

  trino:
    image: crypto-batch-trino
    depends_on:
      - hive-metastore
    ports:
      - "8090:8080"

  superset-db:
    image: postgres:15
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    restart: always

  superset:
    image: crypto-batch-superset
    environment:
      SUPERSET_ENV: production
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_SECRET_KEY: "123456"
      DATABASE_URL: postgresql+psycopg2://superset:superset@superset-db:5432/superset
    depends_on:
      - superset-db
      - trino
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    restart: always
    command: >
      sh -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "

volumes:
  minio:
  postgres:
  superset_home:
  superset_db:

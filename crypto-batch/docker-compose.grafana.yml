services:
  jupyter:
    image: crypto-batch-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/data:/data # shared folder
      - ./spark/extra-jars:/opt/spark-extra-jars/
    working_dir: /data # <-- important!
    environment:
      - JUPYTER_TOKEN=123456

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  hive-metastore:
    image: crypto-batch-hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - HIVE_METASTORE_DRIVER=org.postgresql.Driver
      - HIVE_METASTORE_JDBC_URL=jdbc:postgresql://postgres:5432/metastore
      - HIVE_METASTORE_USER=hive
      - HIVE_METASTORE_PASSWORD=hive
      - HIVE_CUSTOM_CONF_DIR=/opt/hive/conf
    ports:
      - "9083:9083"
    depends_on:
      - postgres
      - minio
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./spark/extra-jars:/opt/spark-extra-jars/ # For Spark only

  postgres:
    image: crypto-batch-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - postgres:/var/lib/postgresql/data

  trino:
    image: crypto-batch-trino
    depends_on:
      - hive-metastore
    ports:
      - "8090:8080"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel
    depends_on:
      - trino
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
  
  

volumes:
  minio:
  postgres:
  grafana-storage:
